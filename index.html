  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://wanoghoco.github.io/pigs_side/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });
    window.tonConnectUI = tonConnectUI;

    async function connectToWallet() {
      try {
        if (isWalletConnected()) {
          alert(tonConnectUI.wallet.account.publicKey);
          payForConnection();
          return;
        }
        const connectedWallet = await tonConnectUI.connectWallet();
      }
      catch (ex) { }
    }

    function isWalletConnected() {
      return tonConnectUI.connected;
    }

    async function disconnectWallet() {
      if (!isWalletConnected()) {
        alert("no wallet connected");
        return;
      }
      await tonConnectUI.disconnect();
    }

    async function initiateTonPayment(tonAmount, paymentAddress,taskId,bonus) {
      try {

        if (!isWalletConnected()) {
          await connectToWallet();
        }

        const transaction = {
          messages: [
            {
              address: paymentAddress,
              amount: (tonAmount * 1000000000)
            }
          ]
        }
        const result = await tonConnectUI.sendTransaction(transaction);
        if (result) {
          onTonPaymentConfirmed(tonConnectUI.wallet.account.address,taskId,bonus)
          return true;
        }
      }
      catch (ex) {
        return false;
      }
    }

  </script>
